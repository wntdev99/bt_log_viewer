<!DOCTYPE html>
<!--
  bt_flow_viewer.html — BT 실행 흐름 시각 재생 뷰어 (MVP)

  bt_flow_check.py export 로 만든 session.json 을 드롭(또는 선택)하면
  트리 구조를 렌더하고, 하단 스크러버로 시점별 노드 상태를 색으로 재생한다.

  의존성 0 (vanilla JS + SVG). file:// 더블클릭 실행. 인터넷 불필요.

  설계: core(stateAt 등 순수 로직) / view(렌더) 분리.
        expected 슬롯 기반 "기대 vs 실제 비교" 오버레이는 후속 확장 자리.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>BT Flow Viewer</title>
<style>
  :root {
    --bg:#1e1f26; --panel:#272935; --line:#4a4d5e; --text:#d8dae5; --muted:#888ca0;
    --idle:#3a3d4a; --running:#f5c542; --success:#4caf68; --failure:#e0584b; --skipped:#5a5d6e;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; color:#fff; }
  header .meta { color:var(--muted); font-size:12px; }
  #drop { color:var(--muted); }
  #drop input { color:var(--text); }
  #sesswrap { color:var(--muted); font-size:12px; }
  header button { background:#34374a; color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:4px 10px; cursor:pointer; font-size:12px; }
  header button:hover { background:#3f4358; }
  select { background:#34374a; color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:4px 6px; font-size:12px; max-width:520px; }
  #stage { flex:1; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; cursor:grab; }
  svg.dragging { cursor:grabbing; }
  .edge { stroke:var(--line); stroke-width:1.2; fill:none; }
  .node rect { stroke:var(--line); stroke-width:1.2; rx:4; }
  .node text { fill:var(--text); font-size:11px; dominant-baseline:middle; }
  .node .type { fill:var(--muted); font-size:9px; }
  .node.sel rect { stroke:#fff; stroke-width:2.5; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; }
  .ctrls { display:flex; align-items:center; gap:12px; }
  button { background:#34374a; color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:5px 12px; cursor:pointer; font-size:13px; }
  button:hover { background:#3f4358; }
  input[type=range] { flex:1; }
  .tl { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; white-space:nowrap; }
  .legend { display:flex; gap:12px; margin-top:8px; font-size:11px; color:var(--muted); align-items:center; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:4px;
    vertical-align:-1px; border:1px solid var(--line); }
  #info { position:absolute; top:10px; right:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:10px 12px; max-width:340px; font-size:12px; display:none; }
  #info b { color:#fff; } #info .k { color:var(--muted); }
  #ticklog { color:var(--muted); font-size:11px; margin-top:6px; height:15px; overflow:hidden; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>BT Flow Viewer</h1>
    <span id="drop">.btlog / .session.json 드롭 또는 <input type="file" id="file" accept=".json,.btlog" multiple></span>
    <label id="sesswrap" style="display:none">세션 <select id="sessionSel"></select></label>
    <button id="mergeBtn" style="display:none" title="로드된 모든 세션을 하나의 통합 타임라인으로 합침">⛓ 합쳐보기</button>
    <span class="meta" id="meta"></span>
  </header>
  <div id="stage">
    <svg id="svg"><g id="root"></g></svg>
    <div id="info"></div>
  </div>
  <footer>
    <div class="ctrls">
      <button id="play">▶︎ 재생</button>
      <button id="rew">⏮</button>
      <input type="range" id="slider" min="0" max="0" value="0">
      <span class="tl" id="tl">0 / 0</span>
      <select id="speed" title="재생 속도">
        <option value="120">8×</option><option value="250">4×</option>
        <option value="500" selected>2×</option><option value="1000">1×</option>
      </select>
    </div>
    <div id="ticklog"></div>
    <div class="legend">
      <span><i style="background:var(--running)"></i>RUNNING</span>
      <span><i style="background:var(--success)"></i>SUCCESS</span>
      <span><i style="background:var(--failure)"></i>FAILURE</span>
      <span><i style="background:var(--skipped)"></i>SKIPPED</span>
      <span><i style="background:var(--idle)"></i>IDLE</span>
      <span style="margin-left:auto">휠=줌, 드래그=이동, 노드 클릭=상세</span>
    </div>
  </footer>
</div>
<script>
// ============================ CORE (순수 로직, UI 무관) ============================
const STATE = {0:'IDLE',1:'RUNNING',2:'SUCCESS',3:'FAILURE',4:'SKIPPED'};
const COLOR = {0:'var(--idle)',1:'var(--running)',2:'var(--success)',3:'var(--failure)',4:'var(--skipped)'};

// uid 별 (transitionIndex, state) 시퀀스 — stateAt 의 인덱스
function buildSeq(timeline) {
  const seq = new Map();
  timeline.forEach((tr, i) => {
    const uid = tr[1], st = tr[2];
    if (!seq.has(uid)) seq.set(uid, []);
    seq.get(uid).push([i, st]);
  });
  return seq;
}
// transition index idx 시점에서 uid 의 상태 (그 이하 마지막 전이). 없으면 IDLE(0).
function stateAt(seq, uid, idx) {
  const arr = seq.get(uid);
  if (!arr) return 0;
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo+hi)>>1; if (arr[m][0] <= idx) { ans = m; lo = m+1; } else hi = m-1; }
  return ans < 0 ? 0 : arr[ans][1];
}

// 트리 레이아웃 (가로: depth→x, 형제→y). 리프 카운터 기반 tidy 간이판.
function layout(root) {
  const NX = 215, NY = 30; let leaf = 0; const nodes = [], edges = [];
  (function walk(n, depth, parent) {
    n._x = depth * NX;
    const kids = n.children || [];
    if (kids.length === 0) { n._y = (leaf++) * NY; }
    else { kids.forEach(c => walk(c, depth+1, n)); n._y = (kids[0]._y + kids[kids.length-1]._y)/2; }
    nodes.push(n);
    if (parent) edges.push([parent, n]);
  })(root, 0, null);
  return { nodes, edges };
}

// ---- .btlog (FileLogger2) 직접 파싱 — bt_flow_check.py parse_btlog 포팅 ----
// 포맷: 'BTCPP4-FileLogger2'(18) + protocol(1) + xml_size(int32 LE) + xml(UTF-8)
//       + first_ts(int64 LE, usec) + [전이 9B: ts_usec(6,상대) uid(2) state(1)]...
// ts 는 first_ts 기준 상대 → absolute epoch-us 환산(.db3 와 동일 단위, 병합 호환).
function parseBtlog(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder('utf-8');
  const magic = 'BTCPP4-FileLogger2';
  if (dec.decode(u8.subarray(0, magic.length)) !== magic)
    throw new Error('btlog magic 불일치 (FileLogger2 파일이 아님)');
  let p = magic.length + 1;                       // magic + protocol(1)
  const xmlSize = dv.getInt32(p, true); p += 4;
  const xmlText = dec.decode(u8.subarray(p, p + xmlSize)); p += xmlSize;
  const firstTs = Number(dv.getBigInt64(p, true)); p += 8;   // usec, 2^53 내 안전
  const n = Math.floor((u8.length - p) / 9), timeline = [];
  for (let k = 0; k < n; k++) {
    const off = p + k * 9;
    let tsRel = 0; for (let b = 5; b >= 0; b--) tsRel = tsRel * 256 + u8[off + b];  // 6B LE
    const uid = u8[off + 6] | (u8[off + 7] << 8);
    timeline.push([firstTs + tsRel, uid, u8[off + 8], 0]);
  }
  return { xmlText, firstTs, timeline };
}

// xml_tree → SubTree 펼친 노드 트리 — bt_flow_check.py _build_tree 포팅 (DOMParser).
function buildTreeFromXml(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML 파싱 실패');
  const root = doc.documentElement;
  const bts = Array.from(root.children).filter(e => e.tagName === 'BehaviorTree');
  const defs = {}; bts.forEach(bt => defs[bt.getAttribute('ID')] = bt);
  const kids = el => Array.from(el.children).filter(c => c.getAttribute('_uid') != null);
  function nodeOf(el) {
    const uid = el.getAttribute('_uid'), tag = el.tagName, name = el.getAttribute('name') || tag;
    if (tag === 'SubTree') {
      const subid = el.getAttribute('ID'), d = defs[subid];
      return { uid: uid != null ? +uid : null, name, type: 'SubTree', subtree: subid,
               children: d ? kids(d).map(nodeOf) : [] };
    }
    return { uid: uid != null ? +uid : null, name, type: tag, children: kids(el).map(nodeOf) };
  }
  const main = bts[0];                              // BTCPP4: 첫 BehaviorTree = main
  const rootNode = main ? kids(main)[0] : null;
  return { tree: rootNode ? nodeOf(rootNode) : null, treeName: main && main.getAttribute('ID') };
}

// 트리 → uid:fullpath(근사) 맵 — bt_flow_check.py _build_nodes_map 포팅.
function buildNodesMap(tree) {
  const nodes = {};
  (function walk(n, prefix) {
    if (n.uid != null) nodes[String(n.uid)] = `${prefix}${n.name || n.type}::${n.uid}`;
    const np = n.type === 'SubTree' ? `${prefix}${n.subtree || 'SubTree'}::${n.uid}/` : prefix;
    (n.children || []).forEach(c => walk(c, np));
  })(tree, '');
  return nodes;
}

// .btlog ArrayBuffer → 뷰어 세션 객체 (Python cmd_export 의 btlog 분기와 동일 스키마).
function sessionFromBtlog(name, buf) {
  const { xmlText, firstTs, timeline } = parseBtlog(buf);
  const { tree, treeName } = buildTreeFromXml(xmlText);
  const date = new Date(firstTs / 1000).toISOString().replace('T', ' ').slice(0, 19); // UTC
  const t0 = timeline.length ? timeline[0][0] : 0;
  const t1 = timeline.length ? timeline[timeline.length - 1][0] : 0;
  return { meta: { tree: treeName, session: 1, date, source: 'btlog', t0, t1,
                   count: timeline.length, file: name },
           tree, nodes: buildNodesMap(tree), timeline, expected: null };
}

// 여러 세션 → 하나의 통합 세션. 레이어별 uid 를 "L{i}:{uid}" 로 네임스페이싱해
// 충돌(두 트리가 모두 uid=1 사용)을 제거하고, 합성 super-root 아래 각 레이어 트리를
// 쌓는다. timeline 은 전 레이어 전이를 absolute epoch-us 로 정렬(동일 시간축 = 병합 근거).
function mergeSessions(sessions) {
  const layerRoots = [], nodes = {}; let timeline = [];
  sessions.forEach((s, li) => {
    const ns = u => `L${li}:${u}`;
    const clone = n => ({ ...n, uid: n.uid != null ? ns(n.uid) : null,
                          children: (n.children || []).map(clone) });
    const troot = s.tree ? clone(s.tree) : null;
    layerRoots.push({ uid: null, name: `▼ L${li} · ${s.meta.tree}`, type: '(layer)',
                      children: troot ? [troot] : [] });
    Object.entries(s.nodes).forEach(([u, fp]) => { nodes[ns(u)] = `L${li}/${fp}`; });
    s.timeline.forEach(tr => timeline.push([tr[0], ns(tr[1]), ...tr.slice(2)]));
  });
  timeline.sort((a, b) => a[0] - b[0]);
  const superRoot = { uid: null, type: '(merged)',
                      name: 'MERGED ' + sessions.map(s => s.meta.tree).join(' + '),
                      children: layerRoots };
  const t0 = timeline.length ? timeline[0][0] : 0;
  const t1 = timeline.length ? timeline[timeline.length - 1][0] : 0;
  return { meta: { tree: sessions.map(s => s.meta.tree).join('+'), session: 'merged',
                   date: sessions[0].meta.date, source: 'merged', t0, t1,
                   count: timeline.length,
                   file: '⛓ ' + sessions.map(s => s.meta.file || ('s' + s.meta.session)).join(' + ') },
           tree: superRoot, nodes, timeline, expected: null };
}

// ============================ VIEW (렌더 + 상호작용) ============================
let DATA=null, SEQ=null, NODES=[], EDGES=[], rectByUid=new Map(), playTimer=null, selUid=null;
const svg=document.getElementById('svg'), gRoot=document.getElementById('root');
const slider=document.getElementById('slider'), tl=document.getElementById('tl');
const info=document.getElementById('info'), ticklog=document.getElementById('ticklog');

function load(data) {
  stop(); selUid=null; info.style.display='none';
  DATA = data; SEQ = buildSeq(data.timeline);
  const lo = layout(data.tree); NODES = lo.nodes; EDGES = lo.edges;
  rectByUid.clear(); gRoot.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  // edges
  EDGES.forEach(([p,c])=>{
    const path=document.createElementNS(NS,'path');
    const x1=p._x+170, y1=p._y, x2=c._x, y2=c._y, mx=(x1+x2)/2;
    path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('class','edge'); gRoot.appendChild(path);
  });
  // nodes
  NODES.forEach(n=>{
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','node');
    g.setAttribute('transform',`translate(${n._x},${n._y-12})`);
    const rect=document.createElementNS(NS,'rect');
    rect.setAttribute('width',170); rect.setAttribute('height',24);
    // uid 없는 합성 노드(MERGED/레이어 헤더)는 상태색 대상 아님 → 헤더색으로 구분.
    rect.setAttribute('fill', n.uid==null ? '#46506e' : COLOR[0]); g.appendChild(rect);
    const t1=document.createElementNS(NS,'text');
    t1.setAttribute('x',8); t1.setAttribute('y',9); t1.setAttribute('class','name');
    const label = n.type==='SubTree' ? ('▸ '+(n.subtree||'SubTree')) : (n.name||n.type);
    t1.textContent = label.length>22 ? label.slice(0,21)+'…' : label;
    g.appendChild(t1);
    const t2=document.createElementNS(NS,'text');
    t2.setAttribute('x',8); t2.setAttribute('y',18); t2.setAttribute('class','type');
    t2.textContent = (n.type==='SubTree'?'SubTree':n.type)+'  #'+n.uid;
    g.appendChild(t2);
    if(n.uid!=null){ rectByUid.set(n.uid,{rect,g,node:n}); g.style.cursor='pointer';
      g.addEventListener('click',e=>{e.stopPropagation(); selectNode(n.uid);}); }
    gRoot.appendChild(g);
  });
  slider.max = data.timeline.length-1; slider.value=0;
  fitView();
  document.getElementById('meta').textContent =
    `${data.meta.tree} · session ${data.meta.session} · ${data.meta.date} · 노드 ${Object.keys(data.nodes).length} · 전이 ${data.meta.count} · ${((data.meta.t1-data.meta.t0)/1e6).toFixed(1)}s`;
  render(0);
}

function render(idx) {
  idx = +idx;
  rectByUid.forEach((o,uid)=> o.rect.setAttribute('fill', COLOR[stateAt(SEQ,uid,idx)]));
  const tr = DATA.timeline[idx];
  const relS = tr ? ((tr[0]-DATA.meta.t0)/1e6).toFixed(3) : '0';
  tl.textContent = `${idx} / ${DATA.timeline.length-1}   t+${relS}s`;
  if (tr) {
    const path = DATA.nodes[tr[1]] || ('#'+tr[1]);
    ticklog.textContent = `t+${relS}s   ${STATE[tr[2]]}   ${path}` + (tr[4]?`   [${tr[4]}]`:'');
  }
  if (selUid!=null) refreshInfo(idx);
}

function selectNode(uid){
  selUid=uid;
  rectByUid.forEach((o,u)=> o.g.classList.toggle('sel', u===uid));
  info.style.display='block'; refreshInfo(+slider.value);
}
function refreshInfo(idx){
  const path = DATA.nodes[selUid] || ('#'+selUid);
  const arr = (SEQ.get(selUid)||[]);
  const cur = stateAt(SEQ, selUid, idx);
  const counts={1:0,2:0,3:0,4:0}; arr.forEach(([,s])=>{ if(counts[s]!=null) counts[s]++; });
  info.innerHTML = `<b>${path}</b><br>`+
    `<span class="k">현재 상태:</span> ${STATE[cur]}<br>`+
    `<span class="k">전이 횟수:</span> ${arr.length}  `+
    `(<span style="color:var(--success)">S ${counts[2]}</span> / `+
    `<span style="color:var(--failure)">F ${counts[3]}</span> / `+
    `<span style="color:var(--running)">R ${counts[1]}</span> / `+
    `<span style="color:var(--skipped)">K ${counts[4]}</span>)`;
}

// 재생
function play(){
  if(playTimer){ stop(); return; }
  document.getElementById('play').textContent='⏸ 일시정지';
  const dt=+document.getElementById('speed').value;
  playTimer=setInterval(()=>{
    let v=+slider.value; if(v>=+slider.max){ stop(); return; }
    slider.value=v+1; render(slider.value);
  }, dt/4);
}
function stop(){ clearInterval(playTimer); playTimer=null; document.getElementById('play').textContent='▶︎ 재생'; }

document.getElementById('play').onclick=play;
document.getElementById('rew').onclick=()=>{ stop(); slider.value=0; render(0); };
slider.oninput=()=>{ render(slider.value); };
document.getElementById('speed').onchange=()=>{ if(playTimer){ stop(); play(); } };

// 줌/팬
let vb={x:-40,y:-20,w:1400,h:800};
function applyVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fitView(){
  const xs=NODES.map(n=>n._x), ys=NODES.map(n=>n._y);
  const minX=Math.min(...xs)-40, maxX=Math.max(...xs)+220;
  const minY=Math.min(...ys)-30, maxY=Math.max(...ys)+30;
  vb={x:minX,y:minY,w:Math.max(maxX-minX,400),h:Math.max(maxY-minY,300)}; applyVB();
}
svg.addEventListener('wheel',e=>{ e.preventDefault();
  const f=e.deltaY>0?1.12:0.89; const r=svg.getBoundingClientRect();
  const mx=vb.x+(e.clientX-r.left)/r.width*vb.w, my=vb.y+(e.clientY-r.top)/r.height*vb.h;
  vb.x=mx-(mx-vb.x)*f; vb.y=my-(my-vb.y)*f; vb.w*=f; vb.h*=f; applyVB();
},{passive:false});
let pan=null;
svg.addEventListener('mousedown',e=>{ pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; svg.classList.add('dragging'); });
window.addEventListener('mousemove',e=>{ if(!pan)return; const r=svg.getBoundingClientRect();
  vb.x=pan.vx-(e.clientX-pan.x)/r.width*vb.w; vb.y=pan.vy-(e.clientY-pan.y)/r.height*vb.h; applyVB(); });
window.addEventListener('mouseup',()=>{ pan=null; svg.classList.remove('dragging'); });
svg.addEventListener('click',()=>{ selUid=null; info.style.display='none';
  rectByUid.forEach(o=>o.g.classList.remove('sel')); });

// ---- 세션 레지스트리 + 드롭다운 (여러 파일/세션 누적 → 선택) ----
let SESSIONS=[];
const sessionSel=document.getElementById('sessionSel'), sesswrap=document.getElementById('sesswrap');
function sessionLabel(s,i){
  const m=s.meta||{};
  return `[${i}] ${m.tree||'?'} · s${m.session} · ${m.date||''} · 전이 ${m.count}` + (m.file?` · ${m.file}`:'');
}
const mergeBtn=document.getElementById('mergeBtn');
function refreshSessionSel(){
  sessionSel.innerHTML='';
  SESSIONS.forEach((s,i)=>{ const o=document.createElement('option');
    o.value=i; o.textContent=sessionLabel(s,i); sessionSel.appendChild(o); });
  sesswrap.style.display = SESSIONS.length>0 ? '' : 'none';
  // 비병합 세션이 2개 이상이면 합쳐보기 가능.
  const base=SESSIONS.filter(s=>(s.meta||{}).source!=='merged').length;
  mergeBtn.style.display = base>=2 ? '' : 'none';
}
mergeBtn.onclick=()=>{
  const base=SESSIONS.filter(s=>(s.meta||{}).source!=='merged');
  if(base.length<2){ alert('합칠 세션이 2개 이상 필요합니다.'); return; }
  addSessions([mergeSessions(base)]);   // 통합 세션을 새 세션으로 추가 후 자동 선택
};
function selectSession(i){ if(i<0||i>=SESSIONS.length) return;
  sessionSel.value=i; load(SESSIONS[i]); }
// json 한 파일은 단일 세션({meta,...}) 또는 멀티세션({sessions:[...]}) 둘 다 허용.
function sessionsOf(json, fname){
  const list = Array.isArray(json.sessions) ? json.sessions : [json];
  list.forEach(s=>{ if(s.meta && !s.meta.file) s.meta.file=fname; });
  return list;
}
function addSessions(list){ if(!list.length) return;
  const base=SESSIONS.length; SESSIONS.push(...list);
  refreshSessionSel(); selectSession(base); }   // 새로 추가된 첫 세션으로 점프

// 확장자별 적재: .btlog 직접 파싱 / .json / .db3 안내
function ingestFile(file){
  const n=file.name.toLowerCase(), r=new FileReader();
  if(n.endsWith('.btlog')){
    r.onload=()=>{ try{ addSessions([sessionFromBtlog(file.name, r.result)]); }
      catch(err){ alert('btlog 파싱 실패: '+(err.message||err)); } };
    r.readAsArrayBuffer(file);
  } else if(n.endsWith('.json')){
    r.onload=()=>{ try{ addSessions(sessionsOf(JSON.parse(r.result), file.name)); }
      catch(err){ alert('JSON 파싱 실패: '+err); } };
    r.readAsText(file);
  } else if(n.endsWith('.db3')){
    alert('.db3 는 브라우저에서 직접 열 수 없습니다 (SQLite).\n'+
          '· bt_flow_check.py export <file>.db3 로 .session.json 생성, 또는\n'+
          '· 같은 세션의 .btlog (고속구간 무손실) 를 드롭하세요.');
  } else { alert('지원하지 않는 형식: '+file.name+'  (.btlog / .json)'); }
}

document.getElementById('file').onchange=e=>{ Array.from(e.target.files).forEach(ingestFile); };
sessionSel.onchange=e=>selectSession(+e.target.value);
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault();
  Array.from(e.dataTransfer.files).forEach(ingestFile); });

// URL 자동 로드 (http 서버로 열 때): ?data=<json> 또는 ?btlog=<btlog>
const qs=new URLSearchParams(location.search);
if(qs.get('data')) fetch(qs.get('data'))
  .then(r=>r.json()).then(j=>addSessions(sessionsOf(j, qs.get('data').split('/').pop()))).catch(()=>{});
if(qs.get('btlog')) fetch(qs.get('btlog'))
  .then(r=>r.arrayBuffer()).then(b=>addSessions([sessionFromBtlog(qs.get('btlog').split('/').pop(), b)])).catch(()=>{});
</script>
